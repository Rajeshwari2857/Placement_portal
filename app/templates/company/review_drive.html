{% extends 'base.html' %}

{% block content %}
    <h1>Update Applications for the Drive</h1>

    {% for application in applications %}
        {{ application.student.student_name }}
        {{ application.application_status }}
        <a class="blue-button"
            href="{% url 'student_application' application.drive.id application.id %}">
            Review application
        </a>
    {% endfor %}

{% endblock %}
