{% extends 'base.html' %}
 
{% block content %}

<h1>Student's Dashboard</h1>

<h2>Organizations</h2>
{% for company in companies %}
    <div>
        {{ company.company_name }}
        <a 
            href="{% url 'company_details' company.id %}">
            View details 
        </a>
    </div>
{% endfor %}

<h2>Applied drives</h2>
{% for application in applied_drives %}
    <div>
        {{ application.drive.drive_name}}
        <a 
            href="{% url 'application_details' application.id %}">
            View details
        </a>
    </div>
{% endfor %}

{% endblock %}
