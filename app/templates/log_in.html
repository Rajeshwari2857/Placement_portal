{% extends "base.html" %}

{% block content %}
    <main class="container">
        <h1>Login Form</h1>

        <form
            action="{% url 'log_in' %}"
            method="post">
                {% csrf_token %}
                    <input 
                        type="text" 
                        name="Username" 
                        placeholder="Username" 
                        required>
                    <br>

                    <input 
                        type="password" 
                        name="Password"     
                        placeholder="Password"  
                        required>
                    <br>
                    
                <button class="blue-button"
                    type="submit">
                    Login
                </button>

                <p>
                    Dont have an account? 
                    <a  
                        href="{% url 'signup' %}">
                        Register
                    </a>
                </p>
        </form>
    </main>
{% endblock %}
