{% extends "base.html" %}

{% block content %}
<h1>Hello {{name}}</h1>

<form
action="{% url 'log_in' %}"
method="post">
    {% csrf_token %}
        Email <input type="text" name="Email">
        Password: <input type="text" name="Password">

    <a href="#">Forgot password?</a>
    <button type="submit">Login</button>

    <p>
        Dont have an account? <a href="{% url 'signup' %}">Sign up</a>
    </p>

</form>

{% endblock %}
